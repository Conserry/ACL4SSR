  use-hosts: false
  use-system-hosts: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist

  default-nameserver:
    - system
    - 119.29.29.29
    - '2402:4e00::'

  nameserver:
    - system

  proxy-server-nameserver:
    - https://hydrogen1693.com:44443/dns-query/48417728-40aa-48cf-8a06-c308d0256139
